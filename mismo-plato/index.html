    <style>
      :root {
        --crema: #f6f0e6;
        --tinta: #3d3a36;
        --acento: #5f6b83; /* el gris azulado del plato */
        --font-body: "Nunito", sans-serif;
        --font-script: "Playfair Display", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: var(--font-body); color: var(--tinta); }

      .card {
        position: absolute;
        background: var(--crema);
        border-radius: 44px;
        box-shadow: 0 18px 50px rgba(40, 32, 20, 0.22);
        text-align: center;
      }
      .script { font-family: var(--font-script); font-style: italic; font-weight: 400; color: var(--acento); }

      /* hook: tapa el texto "mismo plato / 3 momentos" original (y 330–560) */
      #hook-card { left: 110px; top: 280px; width: 860px; height: 380px; padding-top: 52px; }
      #hook-l1 { font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
      #hook-l2 { font-size: 132px; line-height: 1.15; margin-top: 6px; }

      /* etiquetas: tapan "desayunos / meriendas / cenas" originales (y 1440–1505, x 350–760) */
      .label { left: 250px; top: 1362px; width: 580px; height: 220px; padding-top: 30px; }
      .label .num { font-size: 34px; font-weight: 700; letter-spacing: 0.18em; color: var(--acento); }
      .label .word { font-size: 112px; line-height: 1.05; }

      /* cierre */
      #cta-card { left: 90px; top: 720px; width: 900px; height: 380px; padding-top: 86px; }
      #cta-l1 { font-size: 64px; font-weight: 700; line-height: 1.15; }
      #cta-key { font-family: var(--font-body); font-style: normal; font-size: 100px; font-weight: 900; letter-spacing: 0.02em; white-space: nowrap; color: var(--acento); line-height: 1.15; }
      #cta-l2 { font-size: 60px; font-weight: 600; line-height: 1.25; }
      #cta-dim { position: absolute; inset: 0; background: rgba(30, 24, 16, 0.35); }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // hook: completo desde el frame 0 (miniatura)
      tl.fromTo("#hook-l2", { scale: 0.94 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.to("#hook-card", { scale: 0.96, opacity: 0, duration: 0.2, ease: "power2.in" }, 2.8);

      // etiquetas: aparecen con pop suave y se van justo antes del corte
      [["#lab1-card", 3.0, 7.0], ["#lab2-card", 7.0, 11.0], ["#lab3-card", 11.0, 13.13]].forEach(([sel, s, e]) => {
        tl.fromTo(sel, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, s);
        tl.fromTo(sel + " .word", { y: 18 }, { y: 0, duration: 0.4, ease: "power3.out" }, s + 0.05);
        tl.to(sel, { opacity: 0, scale: 0.95, duration: 0.12, ease: "power2.in" }, e - 0.13);
      });

      // cierre
      tl.fromTo("#cta-dim", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.85);
      tl.fromTo("#cta-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 12.9);
      tl.fromTo("#cta-key", { scale: 0.8 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 13.05);

      window.__timelines["main"] = tl;
    </script>
