    <style>
      @font-face {
        font-family: "Comfortaa";
        src: url("assets/fonts/Comfortaa-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 900;
      }
      /* paleta del design system Nido */
      :root {
        --pincipal: #9b4c26;
        --secundario: #7b745a;
        --terciario: #e0b7a6;
        --blanco: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Comfortaa", sans-serif; color: var(--pincipal); }
      .ch { opacity: 0; }

      /* hook: texto claro directo sobre el fondo oscuro */
      #hook-scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 1000px;
        background: linear-gradient(180deg, rgba(40, 22, 12, 0.72) 0%, rgba(40, 22, 12, 0.62) 50%, rgba(40, 22, 12, 0) 100%); }
      #hook-text { position: absolute; left: 110px; top: 330px; width: 860px; }
      #hook-l1, #hook-l2 { font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; white-space: nowrap; }
      #hook-l1 { font-size: 118px; color: var(--blanco); }
      #hook-l2 { font-size: 118px; color: var(--terciario); }

      /* etiquetas: tapan las palabras originales (x 350–760, y 1440–1505) */
      .card { position: absolute; background: var(--blanco); border: 3px solid var(--terciario); border-radius: 24px; text-align: center; }
      .label { left: 270px; top: 1388px; width: 540px; height: 176px; padding-top: 26px; }
      .label .num { font-size: 32px; font-weight: 600; letter-spacing: 0.02em; color: var(--secundario); }
      .label .word { font-size: 80px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }

      /* cierre */
      #cta-dim { position: absolute; inset: 0; background: rgba(40, 22, 12, 0.35); }
      #cta-card { left: 110px; top: 640px; width: 860px; height: 520px; padding-top: 52px; }
      #cta-logo { width: 230px; height: auto; display: block; margin: 0 auto 26px; }
      #cta-key { font-size: 96px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
      #cta-l2 { font-size: 54px; font-weight: 500; color: var(--secundario); margin-top: 14px; }
      #cta-star { position: absolute; right: 34px; top: 30px; width: 64px; height: 64px; }
    </style>
  </head>

      tl.set("#plato", { scale: 1 }, 2.95);

      // escritura letra por letra, sincronizada con los golpes de la máquina de escribir del audio

      // cierre
